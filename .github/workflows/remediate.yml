name: Repovate — Remediate

# Phase 2 items 8-9 (docs/architecture.md section 7): orchestrates up to 3
# isolated patch/verify cycles (attempt.yml) and publishes the result.
# Never auto-merges — that's a later phase, gated on its own config.
#
# Still fed one vulnerability at a time via workflow_call inputs; wiring
# this to real detection + an autonomy decision engine is a later phase.

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      current_version:
        required: true
        type: string
      advisory_id:
        required: true
        type: string
      advisory_summary:
        required: true
        type: string
      advisory_url:
        required: false
        type: string
        default: ""
      manifest_dir:
        description: "Directory containing the manifest to patch, relative to repo root (monorepo support)"
        required: false
        type: string
        default: "."
    secrets:
      anthropic_api_key:
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  attempt-1:
    uses: thmsgo18/Repovate/.github/workflows/attempt.yml@main
    with:
      package_name: ${{ inputs.package_name }}
      current_version: ${{ inputs.current_version }}
      advisory_id: ${{ inputs.advisory_id }}
      advisory_summary: ${{ inputs.advisory_summary }}
      advisory_url: ${{ inputs.advisory_url }}
      manifest_dir: ${{ inputs.manifest_dir }}
      attempt_number: 1
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}

  # Retries only if attempt-1 actually produced a change that then failed
  # verification — never retry a "Claude made no changes" outcome
  # identically, that's not going to change on its own and just spends
  # money for nothing.
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.diff_produced == 'true' && needs.attempt-1.outputs.passed != 'true'
    uses: thmsgo18/Repovate/.github/workflows/attempt.yml@main
    with:
      package_name: ${{ inputs.package_name }}
      current_version: ${{ inputs.current_version }}
      advisory_id: ${{ inputs.advisory_id }}
      advisory_summary: ${{ inputs.advisory_summary }}
      advisory_url: ${{ inputs.advisory_url }}
      manifest_dir: ${{ inputs.manifest_dir }}
      attempt_number: 2
      previous_diff_artifact: ${{ needs.attempt-1.outputs.diff_artifact }}
      previous_log_artifact: ${{ needs.attempt-1.outputs.log_artifact }}
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.diff_produced == 'true' && needs.attempt-2.outputs.passed != 'true'
    uses: thmsgo18/Repovate/.github/workflows/attempt.yml@main
    with:
      package_name: ${{ inputs.package_name }}
      current_version: ${{ inputs.current_version }}
      advisory_id: ${{ inputs.advisory_id }}
      advisory_summary: ${{ inputs.advisory_summary }}
      advisory_url: ${{ inputs.advisory_url }}
      manifest_dir: ${{ inputs.manifest_dir }}
      attempt_number: 3
      previous_diff_artifact: ${{ needs.attempt-2.outputs.diff_artifact }}
      previous_log_artifact: ${{ needs.attempt-2.outputs.log_artifact }}
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}

  publish:
    needs: [attempt-1, attempt-2, attempt-3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      A1_PASSED: ${{ needs.attempt-1.outputs.passed }}
      A1_DIFF_PRODUCED: ${{ needs.attempt-1.outputs.diff_produced }}
      A1_DIFF_ARTIFACT: ${{ needs.attempt-1.outputs.diff_artifact }}
      A1_LOG_ARTIFACT: ${{ needs.attempt-1.outputs.log_artifact }}
      A2_PASSED: ${{ needs.attempt-2.outputs.passed }}
      A2_DIFF_PRODUCED: ${{ needs.attempt-2.outputs.diff_produced }}
      A2_DIFF_ARTIFACT: ${{ needs.attempt-2.outputs.diff_artifact }}
      A2_LOG_ARTIFACT: ${{ needs.attempt-2.outputs.log_artifact }}
      A3_PASSED: ${{ needs.attempt-3.outputs.passed }}
      A3_DIFF_PRODUCED: ${{ needs.attempt-3.outputs.diff_produced }}
      A3_DIFF_ARTIFACT: ${{ needs.attempt-3.outputs.diff_artifact }}
      A3_LOG_ARTIFACT: ${{ needs.attempt-3.outputs.log_artifact }}
    steps:
      - name: Determine outcome
        id: outcome
        run: |
          # Only one attempt can ever have passed — the chain stops the
          # moment one does — so scan newest-first and take the first hit.
          for n in 3 2 1; do
            passed_var="A${n}_PASSED"
            diff_var="A${n}_DIFF_ARTIFACT"
            if [ "${!passed_var}" = "true" ]; then
              echo "status=passed" >> "$GITHUB_OUTPUT"
              echo "diff_artifact=${!diff_var}" >> "$GITHUB_OUTPUT"
              echo "attempt_number=$n" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Nothing passed — fall back to the last attempt that actually
          # produced a diff, for a best-effort draft PR.
          for n in 3 2 1; do
            produced_var="A${n}_DIFF_PRODUCED"
            if [ "${!produced_var}" = "true" ]; then
              diff_var="A${n}_DIFF_ARTIFACT"
              log_var="A${n}_LOG_ARTIFACT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "diff_artifact=${!diff_var}" >> "$GITHUB_OUTPUT"
              echo "log_artifact=${!log_var}" >> "$GITHUB_OUTPUT"
              echo "attempt_number=$n" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "status=nothing" >> "$GITHUB_OUTPUT"

      - name: Log no-op outcome
        if: steps.outcome.outputs.status == 'nothing'
        run: |
          echo "::notice::Repovate made no changes for ${{ inputs.advisory_id }} in ${{ inputs.package_name }} — no PR opened."

      - name: Checkout monitored repository
        if: steps.outcome.outputs.status != 'nothing'
        uses: actions/checkout@v4

      - name: Download diff
        if: steps.outcome.outputs.status != 'nothing'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.outcome.outputs.diff_artifact }}
          path: /tmp/publish

      - name: Download logs
        if: steps.outcome.outputs.status == 'failed'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.outcome.outputs.log_artifact }}
          path: /tmp/publish

      - name: Apply, commit, and open PR
        if: steps.outcome.outputs.status != 'nothing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git apply /tmp/publish/diff.patch
          git config user.name "repovate[bot]"
          git config user.email "repovate-bot@users.noreply.github.com"

          branch="repovate/${{ inputs.advisory_id }}"
          git checkout -b "$branch"
          git add -A
          git commit -m "fix(security): patch ${{ inputs.package_name }} — ${{ inputs.advisory_id }}"
          # Explicit credential, not ambient checkout state — see
          # docs/architecture.md section 7 / the onboarding pipeline's
          # own "Commit onboarding.json" step for why.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$branch"

          cat > /tmp/pr-body.md <<BODY
          This PR was opened automatically by **Repovate**, an autonomous maintenance agent — not a human.

          **Vulnerability:** ${{ inputs.advisory_id }}
          **Package:** \`${{ inputs.package_name }}\` (was \`${{ inputs.current_version }}\`)
          **Summary:** ${{ inputs.advisory_summary }}
          **Reference:** ${{ inputs.advisory_url }}
          **Attempt:** ${{ steps.outcome.outputs.attempt_number }} of up to 3

          ---

          This is Repovate's isolated patch/verify pipeline: the coding step never executed this repository's code, and a separate step ran the actual install/test. No auto-merge — review the diff carefully before merging.
          BODY

          if [ "${{ steps.outcome.outputs.status }}" = "failed" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**⚠️ This patch did NOT pass verification after up to 3 attempts.** Tests failed or the install step errored. Do not merge without reviewing carefully. Last attempt's log (tail):"
              echo ""
              echo '```'
              tail -100 /tmp/publish/log.txt 2>/dev/null
              echo '```'
            } >> /tmp/pr-body.md
          fi

          title="[Repovate] Fix ${{ inputs.advisory_id }} in ${{ inputs.package_name }}"
          draft_flag=""
          if [ "${{ steps.outcome.outputs.status }}" = "failed" ]; then
            title="[Repovate][NEEDS REVIEW] Fix ${{ inputs.advisory_id }} in ${{ inputs.package_name }} (tests failing)"
            draft_flag="--draft"
          fi

          gh pr create $draft_flag --title "$title" --body-file /tmp/pr-body.md
