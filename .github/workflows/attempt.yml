name: Repovate — Remediation attempt (patch + verify, isolated)

# Phase 2 item 8 (docs/architecture.md section 7): one patch/verify cycle,
# split into two jobs specifically so the job holding ANTHROPIC_API_KEY
# never executes the target repo's code (install scripts, tests) — that's
# exactly the attack surface the vulnerability itself might represent.
#
# - job "patch": has the API key, Read/Edit/Write only — no Bash, so it
#   cannot run install/build/test even if it wanted to. It can only edit
#   the manifest and source files directly.
# - job "verify": no API key at all, applies the diff, runs the actual
#   install + test commands. This is deliberately the job that takes on
#   "run code from a repo with a known vulnerability" risk, precisely
#   because it's the job with nothing valuable to steal.
#
# Called 1-3 times by remediate.yml's bounded retry loop (item 9), never
# called directly.

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      current_version:
        required: true
        type: string
      advisory_id:
        required: true
        type: string
      advisory_summary:
        required: true
        type: string
      advisory_url:
        required: false
        type: string
        default: ""
      manifest_dir:
        description: "Directory containing the manifest to patch, relative to repo root (monorepo support)"
        required: false
        type: string
        default: "."
      attempt_number:
        required: true
        type: number
      previous_diff_artifact:
        description: "Name of a previous attempt's diff artifact to give as context — empty on the first attempt"
        required: false
        type: string
        default: ""
      previous_log_artifact:
        description: "Name of a previous attempt's failure log artifact — empty on the first attempt"
        required: false
        type: string
        default: ""
    secrets:
      anthropic_api_key:
        required: true
    outputs:
      passed:
        description: "'true' if verify's install+test succeeded"
        value: ${{ jobs.verify.outputs.passed }}
      diff_produced:
        description: "'true' if the patch job produced any change at all"
        value: ${{ jobs.patch.outputs.diff_produced }}
      diff_artifact:
        description: "Name of this attempt's final diff artifact (patch + any lockfile regenerated by verify)"
        value: ${{ jobs.verify.outputs.diff_artifact }}
      log_artifact:
        description: "Name of this attempt's install/test log artifact"
        value: ${{ jobs.verify.outputs.log_artifact }}

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      diff_produced: ${{ steps.diff.outputs.produced }}
    steps:
      - name: Checkout monitored repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download previous attempt's context
        if: inputs.previous_diff_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_diff_artifact }}
          path: /tmp/previous-attempt

      - name: Download previous attempt's failure log
        if: inputs.previous_log_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_log_artifact }}
          path: /tmp/previous-attempt

      - name: Apply previous attempt's diff for context
        if: inputs.previous_diff_artifact != ''
        run: |
          if [ -f /tmp/previous-attempt/diff.patch ]; then
            git apply /tmp/previous-attempt/diff.patch || echo "::warning::Could not cleanly apply the previous attempt's diff — Claude will see the original tree instead."
          fi

      - name: Patch vulnerable dependency (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          show_full_output: true
          claude_args: |
            --allowedTools Read,Edit,Write
            --model claude-sonnet-5
            --max-turns 25
          prompt: |
            A security advisory affects a dependency used in this repository:

            - Package: ${{ inputs.package_name }}
            - Version currently in use: ${{ inputs.current_version }}
            - Advisory: ${{ inputs.advisory_id }}
            - Summary: ${{ inputs.advisory_summary }}
            - Reference: ${{ inputs.advisory_url }}
            - Manifest directory: ${{ inputs.manifest_dir }}

            ${{ inputs.attempt_number > 1 && 'This is a retry — a previous attempt did not pass. Before doing anything else, read /tmp/previous-attempt/diff.patch (what was tried) and /tmp/previous-attempt/log.txt (why it failed, if that file exists) and take the failure into account.' || 'This is the first attempt.' }}

            You do NOT have a Bash tool, WebFetch, or WebSearch in this job
            — no shell, no internet access, on purpose. Do not attempt to
            look up the advisory, the changelog, or the patched version
            online, and do not try `curl` or any other workaround via a
            tool that isn't available to you — every attempt will simply
            be denied and waste your turn budget. Determine the fix from
            your own knowledge of this package plus what you can Read in
            this repository (manifest, lockfile, source). If you are not
            confident which version fixes this advisory, pick the latest
            stable release of the package — a conservative but reasonable
            default — rather than spending turns trying to research it.

            Edit the manifest and source files directly:

            - If bumping to a patched version is sufficient, edit the
              version string for "${{ inputs.package_name }}" directly in
              the manifest under ${{ inputs.manifest_dir }}. Do not try to
              hand-edit a lockfile — leave it as is; a later, separate step
              regenerates it properly by actually running the install.
            - If the vulnerable code path is genuinely reachable and a
              version bump alone would not fix it, also edit the calling
              code, consistent with the existing style and conventions.
            - Do not fix unrelated issues, refactor unrelated code, or
              upgrade unrelated dependencies.

            Read the relevant manifest and the code that actually
            imports/calls this package before deciding on a fix — don't
            guess from the package name alone.

      - name: Capture diff
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "Claude made no changes."
          else
            echo "produced=true" >> "$GITHUB_OUTPUT"
            git diff --cached > /tmp/diff.patch
          fi

      - name: Upload diff artifact
        if: steps.diff.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repovate-patch-diff-${{ inputs.attempt_number }}
          path: /tmp/diff.patch
          retention-days: 7

  verify:
    needs: patch
    if: needs.patch.outputs.diff_produced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.result.outputs.passed }}
      diff_artifact: ${{ steps.result.outputs.diff_artifact }}
      log_artifact: ${{ steps.result.outputs.log_artifact }}
    steps:
      - name: Checkout monitored repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download patch diff
        uses: actions/download-artifact@v4
        with:
          name: repovate-patch-diff-${{ inputs.attempt_number }}
          path: /tmp/patch

      - name: Apply patch
        id: apply
        run: |
          if git apply /tmp/patch/diff.patch; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Patch did not apply cleanly." > /tmp/log.txt
          fi

      - name: Install and test
        id: run
        if: steps.apply.outputs.applied == 'true'
        working-directory: ${{ inputs.manifest_dir }}
        env:
          # Several test runners (react-scripts/CRA's Jest wrapper among
          # them) default to interactive watch mode unless CI is set,
          # which would hang until the job timeout instead of failing fast.
          CI: "true"
        run: |
          {
            echo "=== npm install ==="
            if npm install 2>&1; then
              install_ok=true
            else
              install_ok=false
            fi
          } > /tmp/log.txt 2>&1
          echo "install_ok=$install_ok" >> "$GITHUB_OUTPUT"

          if [ "$install_ok" = "true" ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            {
              echo ""
              echo "=== npm test ==="
              if npm test 2>&1; then
                echo "test_ok=true" >> "$GITHUB_OUTPUT"
              else
                echo "test_ok=false" >> "$GITHUB_OUTPUT"
              fi
            } >> /tmp/log.txt 2>&1
          else
            echo "test_ok=no_tests" >> "$GITHUB_OUTPUT"
            echo "" >> /tmp/log.txt
            echo "=== no test script found in ${{ inputs.manifest_dir }}/package.json — skipped ===" >> /tmp/log.txt
          fi

      - name: Determine result
        id: result
        run: |
          diff_artifact="repovate-verify-diff-${{ inputs.attempt_number }}"
          log_artifact="repovate-verify-log-${{ inputs.attempt_number }}"
          echo "diff_artifact=$diff_artifact" >> "$GITHUB_OUTPUT"
          echo "log_artifact=$log_artifact" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.apply.outputs.applied }}" != "true" ]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            # No diff to capture — the patch didn't even apply. Still write
            # an (empty) file so the upload step below has something to
            # find; an absent artifact would break the next retry's
            # download step or the publish job's "did anything ever work"
            # fallback logic.
            touch /tmp/diff.patch
            exit 0
          fi

          install_ok="${{ steps.run.outputs.install_ok }}"
          test_ok="${{ steps.run.outputs.test_ok }}"
          if [ "$install_ok" = "true" ] && [ "$test_ok" != "false" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

          # Capture the full resulting diff (manifest edit + whatever
          # `npm install` regenerated in the lockfile) regardless of
          # pass/fail — a failed attempt's best-effort diff still feeds
          # the next retry's context, or the final draft PR if this was
          # the last attempt. Same filename ("diff.patch") as the patch
          # job's own artifact so the retry-context download step in the
          # next attempt doesn't need to know which job produced it.
          git add -A
          git diff --cached > /tmp/diff.patch || true

      - name: Upload verify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.result.outputs.diff_artifact }}
          path: /tmp/diff.patch
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.result.outputs.log_artifact }}
          path: /tmp/log.txt
          retention-days: 7
