name: "Repovate"
description: "Autonomous AI maintenance agent for GitHub repositories — detects CVEs and outdated dependencies, writes context-aware patches, and opens Pull Requests. Runs entirely in GitHub Actions."
author: "thmsgo18"

# Stub — Phase 0. Inputs/outputs will grow as the detection, patch,
# verify and publish steps land (see docs/architecture.md section 3
# and 7). Not yet wired to any real logic.
inputs:
  step:
    description: "Which pipeline step to run: onboard | decide | record-history"
    required: true
  repo-path:
    description: "Path to the checked-out repository being maintained"
    required: false
    default: "."
  anthropic-api-key:
    description: "Anthropic API key, required for onboard and patch steps only"
    required: false

runs:
  using: "node20"
  main: "dist/index.js"
